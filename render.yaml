services:
  - type: web
    name: Whiskey Tides
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GITHUB_OWNER
        value: richardmhuse
      - key: DATA_REPO
        value: do-not-hit-the-bridge
      - key: DATA_BRANCH
        value: main
      - key: DATA_PATH
        value: data/raw/measured.csv
      - key: FORECAST_PATH
        value: data/processed/forecast.json
      - key: PREFER_REMOTE_DATA
        value: "1"
      - key: CACHE_TTL_SECONDS
        value: "60"
      - key: HISTORY_DAYS
        value: "30"
      - key: INITIAL_VIEW_DAYS
        value: "1.5"
      - key: REFRESH_MS
        value: "60000"
      - key: BRIDGE_CLEARANCE_FT
        value: "4.81"
      - key: MIN_WATER_DEPTH_FT
        value: "1.86"
    healthCheckPath: /healthz
